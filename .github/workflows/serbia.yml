name: Serbia MCP CI and deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_rebuild_index:
        description: Rebuild Serbian SQLite index even if the content is unchanged (CI and test host)
        type: boolean
        default: false
  schedule:
    - cron: '25 4 * * *'
permissions:
  contents: read
concurrency:
  group: serbia-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      corpus: ${{ steps.image.outputs.corpus }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            data
            plugins/sr
            serbia
            tests
            tools
          submodules: false
          persist-credentials: false
      - name: Checkout complete Serbian history only
        run: git submodule update --init serbia/national/acts
      - name: Refresh upstream Serbian pin for deployments
        if: github.event_name != 'pull_request'
        run: |
          pin=$(curl --fail --silent --show-error --retry 3 'https://api.github.com/repos/lexifina/global-law/contents/serbia/national/acts?ref=main' | jq -er '.sha')
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          if ! git -C serbia/national/acts cat-file -e "$pin^{commit}" 2>/dev/null; then
            git -C serbia/national/acts fetch origin "$pin"
          fi
          git -C serbia/national/acts checkout --detach "$pin"
          if ! git diff --quiet -- serbia/national/acts; then
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Refresh Serbian corpus to $pin" -- serbia/national/acts
          fi
      - name: Runtime image identity
        id: image
        run: |
          key=$(sha256sum Dockerfile requirements-serbia.txt | sha256sum | cut -c1-32)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:runtime-$key"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "corpus=$(git -C serbia/national/acts rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Reuse or build runtime image
        id: runtime
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] && docker pull "$IMAGE"; then
            echo "Reusing published runtime"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            docker build -t "$IMAGE" .
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          docker image inspect "$IMAGE" --format 'Runtime image: {{.Size}} bytes'
      - name: Determine effective Serbian FTS index identity
        id: fts
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          cache="$PWD/.git/global-law-cache"
          sudo install -d -o 10001 -g "$(id -g)" -m 0775 "$cache"
          key=$(docker run --rm \
            --mount "type=bind,src=$PWD,dst=/app,readonly" \
            --mount "type=bind,src=$cache,dst=/app/.git/global-law-cache" \
            "$IMAGE" python tools/serbia_fts.py --key)
          [[ "$key" =~ ^[0-9a-f]{20}-[0-9a-f]{40}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"
      # Restore and save separately so the index is kept even when later tests fail.
      # One entry per index identity; a forced rebuild replaces it rather than adding another.
      - name: Restore Serbian FTS5 index
        id: fts-cache
        if: inputs.force_rebuild_index != true
        uses: actions/cache/restore@v4
        with:
          path: .git/global-law-cache/serbia-fts/${{ steps.fts.outputs.key }}.sqlite3
          key: serbia-fts-${{ steps.fts.outputs.key }}
      - name: Build or reuse Serbian FTS5 index
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          FORCE_FTS: ${{ inputs.force_rebuild_index == true }}
        run: |
          cache="$PWD/.git/global-law-cache"
          sudo install -d -o 10001 -g 10001 -m 0755 "$cache/serbia-fts"
          sudo chown -R 10001:10001 "$cache/serbia-fts"
          args=()
          if [[ "$FORCE_FTS" == true ]]; then args+=(--force); fi
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/app,readonly" \
            --mount "type=bind,src=$cache,dst=/app/.git/global-law-cache" \
            "$IMAGE" python tools/serbia_fts.py "${args[@]}"
          test -f ".git/global-law-cache/serbia-fts/${{ steps.fts.outputs.key }}.sqlite3"
      - name: Drop replaced Serbian FTS5 index
        if: inputs.force_rebuild_index == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: serbia-fts-${{ steps.fts.outputs.key }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=$KEY&ref=$GITHUB_REF" >/dev/null 2>&1 \
            && echo "Deleted $KEY" || echo "No cached $KEY to replace"
      - name: Save Serbian FTS5 index
        if: inputs.force_rebuild_index == true || steps.fts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/global-law-cache/serbia-fts/${{ steps.fts.outputs.key }}.sqlite3
          key: serbia-fts-${{ steps.fts.outputs.key }}
      # Indexes for superseded code or law are never restored again on this ref.
      - name: Prune superseded Serbian FTS5 indexes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY: serbia-fts-${{ steps.fts.outputs.key }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=$GITHUB_REF&key=serbia-fts-&per_page=100" \
            -q '.actions_caches[].key' | sort -u | while read -r old; do
            if [[ "$old" != "$KEY" ]]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=$old&ref=$GITHUB_REF" >/dev/null && echo "Pruned $old"
            fi
          done
      - name: Test exact runtime and corpus with persistent cache
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          cache="$PWD/.git/global-law-cache"
          sudo install -d -o 10001 -g 10001 -m 0755 "$cache"
          docker run --rm \
            -e SERBIA_FTS_TEST=1 \
            --mount "type=bind,src=$PWD,dst=/app,readonly" \
            --mount "type=bind,src=$cache,dst=/app/.git/global-law-cache" \
            "$IMAGE" python -m unittest discover -s tests/serbia -v
          test -n "$(find "$cache" -type f -print -quit)"
      - name: Publish tested runtime
        if: github.event_name != 'pull_request' && steps.runtime.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$IMAGE"
  deploy-test:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::413560124352:role/serbia-law-mcp-test-github-deploy
          aws-region: eu-central-1
      - name: Deploy image through Systems Manager
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CORPUS: ${{ needs.build.outputs.corpus }}
          SOURCE: ${{ github.sha }}
          FORCE_FTS: ${{ inputs.force_rebuild_index == true }}
          INSTANCE: i-01396c06c547ccf79
        run: |
          commands=$(jq -nc --arg source "$SOURCE" --arg corpus "$CORPUS" --arg image "$IMAGE" --arg force "$FORCE_FTS" '{executionTimeout:["1800"],commands:["set -eu","cloud-init status --wait || test -d /opt/serbia-law-mcp/.git","cd /opt/serbia-law-mcp","git fetch --no-recurse-submodules --filter=blob:none --depth 1 origin " + $source,"deploy_script=$(git show " + $source + ":tools/deploy_serbia_test.sh)","bash -c \"$deploy_script\" -- " + $source + " " + $corpus + " " + $image + " " + $force]}')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --parameters "$commands" --query Command.CommandId --output text)
          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE"; exit 1 ;;
            esac
            sleep 10
          done
          exit 1
