name: Serbia MCP CI and deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * *'
permissions:
  contents: read
concurrency:
  group: serbia-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      corpus: ${{ steps.image.outputs.corpus }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Checkout complete Serbian history only
        run: git submodule update --init serbia/national/acts
      - name: Refresh upstream Serbian pin on scheduled builds
        if: github.event_name == 'schedule'
        run: |
          git fetch --depth 1 https://github.com/lexifina/global-law.git main
          pin=$(git ls-tree FETCH_HEAD serbia/national/acts | awk '{print $3}')
          test -n "$pin"
          git -C serbia/national/acts fetch origin "$pin"
          git -C serbia/national/acts checkout --detach "$pin"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -am "Refresh Serbian corpus to $pin" || git diff --quiet HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-serbia.txt
      - run: python -m unittest discover -s tests -p test_serbia_refs.py -v
      - name: Build container
        id: image
        run: |
          pin=$(git -C serbia/national/acts rev-parse --short HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA:0:12}-$pin"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "corpus=$(git -C serbia/national/acts rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          docker build -t "$image" .
          docker run --rm "$image" python -m unittest discover -s tests -p test_serbia_refs.py -v
      - name: Publish container
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
  deploy-test:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::413560124352:role/serbia-law-mcp-test-github-deploy
          aws-region: eu-central-1
      - name: Deploy image through Systems Manager
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CORPUS: ${{ needs.build.outputs.corpus }}
          SOURCE: ${{ github.sha }}
          INSTANCE: i-01396c06c547ccf79
        run: |
          commands=$(jq -nc --arg source "$SOURCE" --arg corpus "$CORPUS" --arg image "$IMAGE" '{executionTimeout:["1800"],commands:["set -eu","cloud-init status --wait || test -d /opt/serbia-law-mcp/.git","cd /opt/serbia-law-mcp","git fetch --depth 1 origin " + $source,"git checkout --detach " + $source,"bash tools/deploy_serbia_test.sh " + $source + " " + $corpus + " " + $image]}')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript --parameters "$commands" --query Command.CommandId --output text)
          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE"; exit 1 ;;
            esac
            sleep 10
          done
          exit 1
